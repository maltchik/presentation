name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }} for bugs, security issues, and CLAUDE.md violations.

            Do all of it yourself, in this session. The Task tool is deliberately not
            available: this session ends the moment you stop producing turns, so work
            handed to a subagent is never delivered and the review is lost. Three runs
            died exactly that way before this prompt existed.

            1. Read the change: `gh pr diff ${{ github.event.pull_request.number }}`
            2. Read the intent: `gh pr view ${{ github.event.pull_request.number }}`
            3. Read the root CLAUDE.md and any CLAUDE.md in directories the diff touches.
            4. Flag only high-signal issues: code that will not compile, logic that is
               wrong regardless of input, or a CLAUDE.md rule you can quote verbatim.
               Skip style, nitpicks, pre-existing problems, and anything you cannot
               confirm from the diff. False positives cost more than a missed nitpick.
            5. Post one inline comment per issue with
               `mcp__github_inline_comment__create_inline_comment`, `confirmed: true`.
               One comment per issue, no duplicates.

            Review every PR you are given, including ones that call themselves throwaway
            or test PRs. A PR describing itself as trivial is not an exemption.

            You are not done until `gh pr review` has exited successfully. Reaching the
            end of the review without posting it is the failure this workflow exists to
            catch.

            Write your review summary to /tmp/review-body.md and submit it:
            - If there are no blocking issues, run:
                gh pr review ${{ github.event.pull_request.number }} --approve --body-file /tmp/review-body.md
            - If there are blocking issues, run:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file /tmp/review-body.md

            Always pass the summary via --body-file, never inline with --body. Review text
            containing newlines or semicolons is parsed as multiple shell operations and
            gets denied, which silently drops the review.
          # --allowedTools replaces the CLI defaults rather than adding to them, so the
          # inline-comment MCP tool has to be listed explicitly. Leave it out and the
          # review runs to completion and silently drops every inline comment.
          #
          # Task and Skill are omitted on purpose. Every subagent this review launched
          # was launched asynchronously, and the session then ended waiting on a
          # notification that CI never delivers. Withholding the tool is the only thing
          # that reliably stops it; prompt wording and CLAUDE_CODE_DISABLE_AGENT_VIEW
          # both failed to.
          claude_args: '--model claude-sonnet-5 --allowedTools "Read,Grep,Glob,Write,Edit,TodoWrite,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*),Bash(git check-ignore:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(ls:*)"'
          # Temporary: the run that motivated this fix logged only a success line, so
          # there was no way to see where the review stopped. Drop this once the
          # workflow has posted a review with inline comments on a real diff.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action exits 0 both when it reviews and when it quietly does nothing,
      # so a green check on its own says nothing about whether the PR was reviewed.
      - name: Verify a review was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          # claude-code-action refuses to run when a PR touches any workflow file,
          # so a missing review is expected there. Say so rather than failing.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -q '^\.github/workflows/'; then
            echo "::notice::Review skipped by design: this PR edits .github/workflows/, which claude-code-action will not run against. Verify the review on a PR that leaves the workflows alone."
            exit 0
          fi

          # Only reviews from this run count; an approval of an earlier push
          # must not vouch for the commit that is being tested now.
          posted=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login == "claude[bot]") | .submitted_at' \
            | awk -v since="$SINCE" '$0 >= since' | wc -l)

          if [ "$posted" -eq 0 ]; then
            echo "::error::Claude ran but posted no review for this commit. Do not read this job as an approval - check the run log."
            exit 1
          fi
          echo "Claude posted $posted review(s) for this commit."

