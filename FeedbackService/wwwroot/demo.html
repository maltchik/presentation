<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback widget demo host</title>
  <link rel="stylesheet" href="/feedback-widget.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    fieldset { margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; }
    input { padding: 6px; width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
    #state { white-space: pre-wrap; background: #f4f4f4; padding: 10px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Host app (demo)</h1>
  <p>This page stands in for the real web app. It owns the "current release" and the session
     token, and hands both to the widget on load - exactly what KAN-1 assumes a host app does.</p>

  <fieldset>
    <legend>Simulated app state</legend>
    <label for="release">Current release/build version</label>
    <input id="release" value="2.4">

    <label for="authToken">Session token (forwarded as Authorization: Bearer &lt;token&gt;)</label>
    <input id="authToken" value="demo-user-1">

    <button id="load">Load app (mount widget if this release hasn't been handled)</button>
    <button id="reset">Reset this device's stored state</button>
  </fieldset>

  <h2>Device state</h2>
  <div id="state"></div>

  <script src="/feedback-widget.js"></script>
  <script>
    var STORAGE_KEY = 'feedbackWidget.lastHandledRelease';

    function refreshState() {
      document.getElementById('state').textContent =
        'localStorage["' + STORAGE_KEY + '"] = ' + JSON.stringify(localStorage.getItem(STORAGE_KEY));
    }

    document.getElementById('load').addEventListener('click', function () {
      document.querySelectorAll('.feedback-widget').forEach(function (node) { node.remove(); });
      FeedbackWidget.init({
        release: document.getElementById('release').value,
        authToken: document.getElementById('authToken').value
      });
      refreshState();
    });

    document.getElementById('reset').addEventListener('click', function () {
      localStorage.removeItem(STORAGE_KEY);
      refreshState();
    });

    refreshState();
  </script>
</body>
</html>
